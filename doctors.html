<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Doctors | CarePoint</title><link rel="stylesheet" href="assets/css/style.css"><script defer src="assets/js/app.js"></script></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar"><button class="menu-btn" id="menuBtn">☰</button><div><div class="eyebrow">CARE TEAM</div><h1>Doctors & specialties</h1></div><button class="button primary" id="addDoctorBtn">＋ Add doctor</button></header><div class="page-intro"><p>Manage the clinicians available for assignment to treatment visits.</p></div><section class="toolbar"><input id="doctorSearch" class="search-input" placeholder="Search doctor or specialty…"></section><section id="doctorCards" class="doctor-grid"></section><footer>Use verified professional details in a live deployment.</footer></main></div><dialog id="doctorDialog" class="dialog"><form id="doctorForm" method="dialog"><div class="panel-head"><div><h3>Add a doctor</h3><p>Enter a clinician profile</p></div><button type="button" class="close-btn" id="closeDoctor">×</button></div><label>Full name *<input name="name" required maxlength="100" placeholder="Dr. Full Name"></label><label>Specialty *<input name="specialty" required maxlength="100" placeholder="e.g. Paediatrics"></label><label>Department<input name="department" maxlength="100"></label><label>Professional registration / staff ID<input name="staffId" maxlength="80"></label><div class="form-actions"><button class="button secondary" type="button" id="cancelDoctor">Cancel</button><button class="button primary" type="submit">Save doctor</button></div></form></dialog></body></html>
