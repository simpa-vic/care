<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Record Treatment | CarePoint</title><link rel="stylesheet" href="assets/css/style.css"><script defer src="assets/js/app.js"></script></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar"><button class="menu-btn" id="menuBtn">☰</button><div><div class="eyebrow">CLINICAL RECORDS</div><h1>Record a treatment visit</h1></div><a class="button secondary" href="visits.html">← Back to visits</a></header><div class="page-intro"><p>Record a diagnosis, treatment summary, clinician, cost and outcome for one encounter.</p></div><form id="visitForm" class="panel form-panel"><div class="form-section-title"><span>02</span><div><h3>Encounter details</h3><p>Link this treatment to a registered patient</p></div></div><div class="form-grid"><label>Patient *<select name="patientId" id="visitPatient" required><option value="">Choose patient</option></select></label><label>Visit date *<input name="date" type="date" required></label><label>Illness / diagnosis *<input name="diagnosis" required maxlength="150" placeholder="e.g. Malaria"></label><label>Doctor *<select name="doctor" id="visitDoctor" required><option value="">Choose doctor</option></select></label><label class="full">Symptoms / clinical notes<textarea name="symptoms" rows="2" maxlength="1500"></textarea></label><label class="full">Treatment given *<textarea name="treatment" rows="3" required maxlength="2000"></textarea></label><label>Outcome *<select name="outcome" required><option value="">Select outcome</option><option>Recovered</option><option>Improved</option><option>Ongoing</option><option>Referred</option><option>Deceased</option></select></label><label>Cost of treatment (₦)<input name="cost" type="number" min="0" step="0.01" value="0" required></label><label>Follow-up date<input name="followUp" type="date"></label><label>Department<input name="department" maxlength="100" placeholder="e.g. General Medicine"></label></div><div class="form-actions"><a class="button secondary" href="visits.html">Cancel</a><button class="button primary" type="submit">Save treatment record</button></div></form><footer>Only authorized clinical staff should enter or review patient records.</footer></main></div></body></html>
