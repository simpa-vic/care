<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register Patient | CarePoint</title><link rel="stylesheet" href="assets/css/style.css"><script defer src="assets/js/app.js"></script></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar"><button class="menu-btn" id="menuBtn">☰</button><div><div class="eyebrow">PATIENT MANAGEMENT</div><h1>Register patient</h1></div><a class="button secondary" href="patients.html">← Back to patients</a></header><div class="page-intro"><p>Enter demographic and contact details. Patient ID is generated automatically.</p></div><form id="patientForm" class="panel form-panel"><div class="form-section-title"><span>01</span><div><h3>Personal information</h3><p>Basic patient identity details</p></div></div><div class="form-grid"><label>First name *<input name="firstName" required maxlength="60"></label><label>Last name *<input name="lastName" required maxlength="60"></label><label>Date of birth *<input name="dob" type="date" required></label><label>Gender *<select name="gender" required><option value="">Select gender</option><option>Female</option><option>Male</option><option>Other</option><option>Prefer not to say</option></select></label><label>Phone number<input name="phone" type="tel" maxlength="30"></label><label>Email address<input name="email" type="email" maxlength="120"></label><label class="full">Address<textarea name="address" rows="2" maxlength="300"></textarea></label><label class="full">Emergency contact<input name="emergency" maxlength="120" placeholder="Name and phone number"></label></div><div class="form-actions"><a class="button secondary" href="patients.html">Cancel</a><button class="button primary" type="submit">Save patient record</button></div></form><footer>Collect only information your facility is authorized to process.</footer></main></div></body></html>
